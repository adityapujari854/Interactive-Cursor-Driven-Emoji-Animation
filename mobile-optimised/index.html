<script

<!-- =========================================================
     ANIMATION VERSION SWITCHER

     Full version:
         index.html

     Reduced/mobile version:
         mobile-optimised/index.html

     This preserves your previous button behavior.
     ========================================================= -->

<script>
(() => {

    "use strict";


    const toggle =
        document.getElementById(
            "animationToggle"
        );


    if (!toggle) {
        return;
    }


    const isMobileOptimised =
        window.location.pathname.includes(
            "/mobile-optimised/"
        );


    const targetPath =
        isMobileOptimised
            ? "../index.html"
            : "mobile-optimised/index.html";


    toggle.setAttribute(
        "aria-label",
        isMobileOptimised
            ? "Switch to full animation"
            : "Switch to reduced animation"
    );


    toggle.addEventListener(
        "click",
        () => {

            /*
             * Prevent double taps/clicks.
             */

            if (
                toggle.dataset.switching === "true"
            ) {
                return;
            }


            toggle.dataset.switching =
                "true";


            toggle.disabled =
                true;


            /*
             * Navigate to the other version.
             */

            window.location.href =
                targetPath;

        }
    );


})();
</script>
