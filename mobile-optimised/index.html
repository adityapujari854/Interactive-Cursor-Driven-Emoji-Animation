    <!-- Performance hints -->

    <link
        rel="preconnect"

         STATIC BACKGROUND
         ===================================================== -->

    <div
        id="backgroundGlow"

        aria-hidden="true"

         HEADER
         ===================================================== -->

        class="world-header"
    >

        <button
            id="animationToggle"
            class="theme-toggle"
            type="button"
            aria-label="Switch to full animation view"
        >
            <span class="theme-toggle-icon" aria-hidden="true">✨</span>
            <span>Reduced animation</span>
        </button>

        <div
            class="brand"
        >

            <div
                class="brand-icon"
                aria-hidden="true"

                ✨

            >

                    Emoji World

                    INTERACTIVE 3D CHARACTERS

            </div>

        </div>

    </header>

                >

                        class="emoji-visual"
                        src="../assets/emojis/512 (1).webp"

                        width="108"
                        height="108"
                        loading="eager"
                        decoding="async"
                        draggable="false"

<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script
    src="script.js"
    defer
></script>

<script>
    (() => {
        const toggle = document.getElementById("animationToggle");

        if (!toggle) {
            return;
        }

        const targetPath = window.location.pathname.includes("/mobile-optimised/")
            ? "../index.html"
            : "mobile-optimised/index.html";

        toggle.addEventListener("click", () => {
            window.location.href = targetPath;
        });
    })();
</script>
