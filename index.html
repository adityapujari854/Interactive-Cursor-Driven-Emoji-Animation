<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sleeping Emoji Cursor Animation</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page" aria-label="Interactive sleeping emoji cursor animation">
      <section class="scene" id="scene" aria-label="Sleeping green characters reacting to pointer light">
        <div class="scene__atmosphere" aria-hidden="true"></div>
        <div class="scene__grid" id="emojiGrid" aria-hidden="true"></div>
        <div class="cursor-light" id="cursorLight" aria-hidden="true"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
