<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Interactive 3D Emoji World with cursor-driven animations"
    >

    <title>Interactive 3D Emoji World</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =====================================================
         MAIN INTERACTIVE WORLD
         ===================================================== -->

    <main
        id="scene"
        class="scene"
    >

        <!-- =================================================
             BACKGROUND
             ================================================= -->

        <div
            id="backgroundGlow"
            class="background-glow"
            aria-hidden="true"
        ></div>


        <div
            id="particlesLayer"
            class="particles-layer"
            aria-hidden="true"
        ></div>


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="world-header">

            <div class="brand">

                <div
                    class="brand-icon"
                    aria-hidden="true"
                >
                    ✨
                </div>

                <div class="brand-text">

                    <h1>
                        Emoji World
                    </h1>

                    <p>
                        INTERACTIVE 3D CHARACTERS
                    </p>

                </div>

            </div>

        </header>


        <!-- =================================================
             CURSOR LIGHT
             ================================================= -->

        <div
            id="cursorLight"
            class="cursor-light"
            aria-hidden="true"
        >

            <div
                class="cursor-light-halo"
            ></div>

            <div
                class="cursor-light-core"
            ></div>

        </div>


        <!-- =================================================
             EMOJI WORLD
             ================================================= -->

        <section
            id="emojiWorld"
            class="emoji-world"
            aria-label="Interactive emoji characters"
        >

            <div
                id="emojiGrid"
                class="emoji-grid"
            >


                <!-- =========================================
                     EMOJI 01
                     ========================================= -->

                <article
                    class="emoji-card"
                    data-index="0"
                    data-animation="bounce"
                >

                    <div class="emoji-character">

                        <div class="emoji-glow"></div>

                        <img
                            class="emoji-visual"
                            src="assets/emojis/512 (1).webp"
                            alt="Happy emoji"
                            draggable="false"
                        >

                    </div>

                    <div class="glass-platform">

                        <div class="platform-highlight"></div>

                    </div>

                </article>

        <!-- =================================================

        <!-- =================================================
